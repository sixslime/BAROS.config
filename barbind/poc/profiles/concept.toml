[[passes]]
# escape can be omitted for none:
capture = {start = '%', end = '%', escape = '\'}
files = ["**"]
[[passes.layers]]
# can be omitted to match all files in current pass:
files = ["**"]
transform = { map = "map_1" }
[[passes.layers]]
# functions pass the capture to stdin and read stdout.
# 'args' get passed as positional args, may be omitted for none.
transform = { function = 'surround.nu', args = ['(', ')'] }
[[passes.layers]]
files = ["nvim/**"]
transform = { map = "map_2"}
[[passes.layers]]
transform = { composite = 'sequence_1'}