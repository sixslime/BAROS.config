
# -- AXIOM --

# key aliases ~_:
[[passes]]
capture = {start = '~_', end = '_', escape = 'BBESC^KA'}
files = ["**"]
[[passes.layers]]
transform = { map = 'axiom/bindings/key_alias'}
[[passes.layers]]
transform = { composite = 'util/recapture', c_args = ['#_', '_', 'BBESC^KP'] }

# modifier aliases ~-:
[[passes]]
capture = {start = '~-', end = '-', escape = 'BBESC^MA'}
files = ["**"]
[[passes.layers]]
transform = { map = 'axiom/bindings/modifier_alias'}
[[passes.layers]]
transform = { composite = 'util/recapture', c_args = ['#-', '-', 'BBESC^MP'] }

# modifier positions #-:
[[passes]]
capture = {start = '#-', end = '-', escape = 'BBESC^MP'}
files = ["**"]
[[passes.layers]]
transform = { map = 'axiom/bindings/modifier_pos' }
[[passes.layers]]
transform = { function = 'util/escape.nu', args = ['BBESC^BIND', '|']}

# escape key positions for binding #_:
capture = {start = '#_', end = '_', escape = 'BBESC^KP'}
preserve_escape = true
files = ["**"]
[[passes.layers]]
transform = { function = 'util/escape.nu', args = ['BBESC^BIND', '|']}

# shift convert @| -> $|, #_ -> !_:
[[passes]]
capture = {start = '@|', end = '|', escape = 'BBESC^BIND'}
preserve_escape = true
files = ["**"]
[[passes.layers]]
transform = { function = 'axiom/shift_convert.nu', args = ['#_', '_', '!_', '_'] }
[[passes.layers]]
transform = { function = 'util/surround.nu', args = ['$|', '|']}

# unshifted key positions #_:
[[passes]]
capture = {start = '#_', end = '_', escape = 'BBESC^KP'}
preserve_escape = { inside = false, outside = true }
files = ["**"]
[[passes.layers]]
transform = { map = 'axiom/bindings/key_pos' }

# shifted key positions !_:
[[passes]]
capture = {start = '!_', end = '_', escape = 'BBESC^KP'}
files = ["**"]
[[passes.layers]]
transform = { map = 'axiom/bindings/shift_pos' }

# -- PROGRAM INTERPRETS $| --

[[passes]]
capture = {start = '$|', end = '|', escape = 'BBESC^BIND'}
files = ["**"]

# nvim:
[[passes.layers]]
files = ["nvim/**"]
transform = { composite = 'interpret/nvim' }
