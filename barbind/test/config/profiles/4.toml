[[passes]]
files = ['**']
capture = {start = '(', end = ')'}
layers = [
    { transform = { composite = 'quxhi' } },
]

[[passes]]
files = ['**']
capture = {start = '<', end = '>'}
layers = [
    { transform = { composite = 'remap', args = ['quxadd', '[', ']'] } },
]

[[passes]]
files = ['**']
capture = {start = '[', end = ']'}
layers = [
    { transform = { function = 'lowercase' } },
    { transform = { composite = 'remap', args = ['foobarbaz', '-', '-'] } },
]