action_key: meta

startup_apps:
  - command: swaybg -i /home/six/refs/background
    restart_on_death: false
    in_systemd_scope: true

terminal: alacritty

inner_gaps:
  x: 10
  y: 10

outer_gaps:
  x: 10
  y: 10

border:
  size: 0
  color:
    r: 230
    g: 230
    b: 230
    a: 80
  focus_color:
    r: 230
    g: 230
    b: 230
    a: 255
  radius: 0

enable_animations: false

workspace_back_and_forth: false

move_modifier:
  - primary
  - shift

drag_and_drop:
  enabled: false

mouse:
  handedness: right
  vscroll_speed: 1.0
  hscroll_speed: 1.0
  acceleration_bias: 0.0
  acceleration: none

touchpad:
  disable_while_typing: false
  disable_with_external_mouse: false
  acceleration_bias: 1.0
  vscroll_speed: 1.0
  hscroll_speed: 1.0
  tap_to_click: false
  middle_mouse_button_emulation: false
  click_mode: finger_count
  scroll_mode: two_finger_scroll

default_action_overrides:
  - name: terminal
    action: down
    modifiers:
      - meta
    key: space
  - name: select_left
    action: down
    modifiers:
      - primary
    key: o
  - name: select_down
    action: down
    modifiers:
      - primary
    key: u
  - name: select_up
    action: down
    modifiers:
      - primary
    key: a
  - name: select_right
    action: down
    modifiers:
      - primary
    key: e
  - name: move_left
    action: down
    modifiers:
      - primary
    key: O
  - name: move_down
    action: down
    modifiers:
      - primary
    key: U
  - name: move_up
    action: down
    modifiers:
      - primary
    key: A
  - name: move_right
    action: down
    modifiers:
      - primary
    key: E
  - name: quit_active_window
    action: down
    modifiers:
      - primary
    key: slash
  - name: reload_config
    action: down
    modifiers:
      - primary
    key: R
  - name: quit_compositor
    action: down
    modifiers:
      - meta
    key: BackSpace
  # unbinds:
  - name: toggle_floating
    action: down
    modifiers:
      - primary
    key: Arabic_0
  - name: toggle_tabbing
    action: down
    modifiers:
      - primary
    key: Arabic_0
  - name: toggle_stacking
    action: down
    modifiers:
      - primary
    key: Arabic_0
  - name: magnifier_on
    action: down
    modifiers:
      - primary
    key: Arabic_0

